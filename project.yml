name: SmartNote
options:
  bundleIdPrefix: com.skyc8266
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "16.0"
  developmentLanguage: zh-Hans
  generateEmptyDirectories: true

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.4.0"

# 统一版本号定义（单一真相源，修改此处自动同步到所有 Target）
version: &version
  marketing: "2.1.0"
  build: "101"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    # 版本号统一引用（通过 xcodegen 变量替换）
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "101"

targets:
  # ==================== macOS 主应用 ====================
  SmartNote:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes:
          - "**/Assets.xcassets"
          # macOS 使用 Platforms/macOS 下的原实现（逐位不变）；
          # Shared 里的副本是给 iOS 用的跨平台版本，两者不可同时编译。
          - "**/UpdateService.swift"
      - path: Platforms/macOS
        excludes:
          - "**/Info.plist"
          - "**/*.plist"
    dependencies:
      - package: Markdown
    preBuildScripts:
      - name: Copy Ciallo Web Files
        inputPaths:
          - "$(SRCROOT)/ciallo"
        outputPaths:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/ciallo"
        script: |
          echo "Copying ciallo web files to app bundle..."
          destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/ciallo"
          mkdir -p "$destination"
          /usr/bin/rsync -a --delete --delete-excluded --exclude='.DS_Store' --exclude='.*' --exclude='/ajax/' "$SRCROOT/ciallo/" "$destination/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.smartnote
        CODE_SIGN_ENTITLEMENTS: Platforms/macOS/Resources/SmartNote.entitlements
        PRODUCT_NAME: SmartNote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "$(MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "$(CURRENT_PROJECT_VERSION)"
        ENABLE_RESOURCE_ACCESS_CALENDARS: YES
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: NO
        GENERATE_INFOPLIST_FILE: YES
        # 同 iOS target：必须是空字符串，用来关掉 xcodegen 的 Info.plist 自动发现。
        # 仓库根目录的 Build/ 下还躺着几个历史 Info.plist（Build/Info.plist、
        # Build/macOS/Info.plist、Build/Info-iOS.plist、Build/Info-macOS.plist），
        # 它们同样在 xcodegen 的探测范围内。一旦被误指给本 target，
        # macOS App 的 Info.plist 就会被替换成别的内容。
        # 显式空值让 macOS 的 Info.plist 只由 GENERATE_INFOPLIST_FILE +
        # 下面的 INFOPLIST_KEY_* 生成，与迁移前完全一致。
        INFOPLIST_FILE: ""
        INFOPLIST_KEY_CFBundleName: SmartNote
        INFOPLIST_KEY_CFBundleDisplayName: 智学笔记
        INFOPLIST_KEY_CFBundleIdentifier: com.skyc8266.smartnote
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundlePackageType: APPL
        INFOPLIST_KEY_CFBundleExecutable: SmartNote
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Skyc8266"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 智学笔记需要访问日历，以便将复习计划创建为日历事件。
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 智学笔记需要访问提醒事项，以便将复习任务创建为提醒。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 智学笔记需要访问本地网络，以便连接同一局域网中的 P2P 设备。
        INFOPLIST_KEY_NSBonjourServices: _tcp
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
    entitlements:
      path: Platforms/macOS/Resources/SmartNote.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.reminders: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true

  # ==================== iOS 主应用 ====================
  SmartNote-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes:
          - "**/Assets.xcassets"
      - path: Platforms/iOS
        excludes:
          - "**/Info.plist"
          - "**/*.plist"
          # 小组件源码已停用（见下方 SmartNoteWidget target 的说明）。
          # 整个 Platforms/iOS 都是本 target 的 sources，不排除的话
          # SmartNoteWidget.swift 会被当成主 App 的代码编译进去——
          # 它 import WidgetKit 并声明 Widget/View，虽然能编译，但纯属死代码，
          # 且一旦小组件恢复就会与扩展 target 里的同名类型冲突。
          - "Views/Widget/**"
          # 灵动岛源码同理：主 App 并不引用 Pomodoro/ExamCountdown 这些
          # ActivityAttributes，不排除就会被编译进主 App，
          # 既是无用代码，也会与扩展 target 里的同名类型冲突。
          - "Views/LiveActivity/**"
      - path: Shared/Models/NotificationTypes.swift
    dependencies:
      - package: Markdown
      # 目前主 App 不嵌入任何扩展：
      #   - 小组件（SmartNoteWidget）无 App Groups 权限，暂时停用；
      #   - 灵动岛（SmartNoteLiveActivity）暂时停用，原因见下方 target 注释。
      #
      # 恢复某个扩展时，在这里加回对应依赖（缺了就不会被拷进 App 包）：
      #   - target: SmartNoteWidget
      #     embed: true
      #   - target: SmartNoteLiveActivity
      #     embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.smartnote.ios
        CODE_SIGN_ENTITLEMENTS: Platforms/iOS/Resources/SmartNote.entitlements</path>
        PRODUCT_NAME: SmartNote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "$(MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "$(CURRENT_PROJECT_VERSION)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MULTIPLE_WINDOWS: YES
        APPLICATION_EXTENSION_API_ONLY: NO
        # ---- 签名 ----
        # 交给 Xcode 管理（Automatic）。个人（免费）账号请在 Xcode 的
        # Signing & Capabilities 里选一次你的团队，之后会记住。
        # 想固定团队，把下面一行填成 10 位 Team ID（Xcode 里点开 Team 就能看到）。
        CODE_SIGN_STYLE: Automatic
        #
        # 这里刻意**不**设置下面这些键：
        #   CODE_SIGNING_ALLOWED / CODE_SIGNING_REQUIRED / CODE_SIGN_IDENTITY
        #   PROVISIONING_PROFILE_SPECIFIER / CODE_SIGNING_IDENTITY[sdk=...]
        # 之前为了「不签名直接侧载」把它们全关成 NO / 空值，结果是：
        #   - Xcode 无法为个人账号自动创建/匹配描述文件；
        #   - Widget / LiveActivity 扩展无法与主 App 一起签名，装机即失败；
        #   - 命令行 `xcodebuild -sdk iphoneos` 也会因为「不签名」而无法产出真机包。
        # 如果确实需要完全免签名（例如只做静态检查），在 xcodebuild 命令行传
        # CODE_SIGNING_ALLOWED=NO 覆盖即可，不必写进工程。
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: YES
        # 必须是空字符串，不能省。
        #
        # xcodegen 2.46 有一个**自动发现**行为：当 target 没写 `info:` 时，
        # 它会自己在工程目录里找一个 Info.plist 并塞进 INFOPLIST_FILE，
        # **即使该文件已被 sources 的 excludes 排除掉**（excludes 只影响编译，
        # 不影响这个探测）。
        #
        # 后果：主 App 曾被自动指向
        #   Platforms/iOS/Views/LiveActivity/Info.plist
        # 于是主 App 生成的 Info.plist 里带上了
        #   NSExtension.NSExtensionPointIdentifier = com.apple.live-activity-extension
        # 启动即崩溃：
        #   "Plist keys indicate the current process is an extension but
        #    NSExtensionMain() has not been called. UIKit will treat this
        #    process as an extension."
        #
        # 显式写空字符串可以确定性地关掉这个探测。
        # 主 App 的 Info.plist 完全由 GENERATE_INFOPLIST_FILE + 下面的
        # INFOPLIST_KEY_* 生成，永远不应该指向任何扩展的 plist。
        INFOPLIST_FILE: ""
        # 启动画面：必须配，否则 App 无法全屏。
        #
        # iOS 的规则是：Info.plist 里既没有 `UILaunchScreen`、也没有
        # `UILaunchStoryboardName` 指向的 storyboard 时，系统判定这个 App
        # 是「为旧版 iOS 编写的老 App」，于是进入**兼容模式**，把界面按
        # 老式固定分辨率（如 640×960）居中绘制，四周补黑边。
        # 表现就是：明明是全面屏手机，App 却只占中间一小块，上下大片黑边。
        #
        # 这跟设备、跟 `UIRequiresFullScreen` 都无关，纯 Info.plist 问题。
        # 本工程没有手写 LaunchScreen.storyboard，直接让系统生成一个空的
        # `UILaunchScreen` 字典即可（iOS 14+，本工程部署目标 18.0，满足）。
        # 启动画面只是黑屏一瞬，不影响界面样式。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleName: SmartNote
        INFOPLIST_KEY_CFBundleDisplayName: 智学笔记
        INFOPLIST_KEY_CFBundleIdentifier: com.skyc8266.smartnote.ios
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundlePackageType: APPL
        INFOPLIST_KEY_CFBundleExecutable: SmartNote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Skyc8266"
        INFOPLIST_KEY_UIApplicationSceneManifest_UIApplicationSupportsMultipleScenes: true
        INFOPLIST_KEY_UIApplicationSceneManifest_UISceneConfigurations_UIWindowSceneSessionRoleApplication_0_UISceneConfigurationName: Default Configuration
        INFOPLIST_KEY_UIApplicationSceneManifest_UISceneConfigurations_UIWindowSceneSessionRoleApplication_0_UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: false
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 智学笔记需要访问日历，以便将复习计划创建为日历事件。
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 智学笔记需要访问提醒事项，以便将复习任务创建为提醒。
        INFOPLIST_KEY_NSCameraUsageDescription: 智学笔记需要访问相机，用于扫描文档、拍照 OCR、拍照记录。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 智学笔记需要访问相册，用于导入图片资料、设置背景图片。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 智学笔记需要访问麦克风，用于语音笔记、语音转文字。
        # 语音识别权限说明。
        #
        # 缺这一项会**启动即崩溃**（不是用到才崩）：
        #   VoiceMemoService.init() → requestPermissions() →
        #   SFSpeechRecognizer.requestAuthorization
        # 而 requestPermissions() 是在 init 里调用的，所以只要这个服务被创建，
        # 就一定会撞上系统检查：
        #   "This app has crashed because it attempted to access
        #    privacy-sensitive data without a usage description. The app's
        #    Info.plist must contain an NSSpeechRecognitionUsageDescription key"
        #
        # 注意与 NSMicrophoneUsageDescription 的区别：前者是「访问麦克风录音」，
        # 这一项是「把音频交给 Apple 的语音识别服务转文字」，两个都要声明。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 智学笔记需要语音识别权限，用于将语音笔记实时转换成文字。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 智学笔记需要访问本地网络，以便连接同一局域网中的 P2P 设备。
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: 智学笔记需要蓝牙权限，用于设备发现与连接。
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 智学笔记需要位置权限，用于地理围栏打卡、位置记录。
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: 智学笔记需要后台位置权限，用于地理围栏打卡提醒。
        INFOPLIST_KEY_NSFaceIDUsageDescription: 智学笔记使用 Face ID/Touch ID 保护隐私数据（日记加密、文件加密）。
    entitlements:
      path: Platforms/iOS/Resources/SmartNote.entitlements
      # ------------------------------------------------------------------
      # 个人（免费）开发者账号下，本工程**不使用任何需要付费账号的能力**。
      #
      # 曾经尝试过「运行时探测能力是否可用」的做法，已全部废弃——探测本身就是
      # 触发崩溃的那一步：访问 CKContainer 会直接抛
      #   "In order to use CloudKit, your process must have a
      #    com.apple.developer.icloud-services entitlement. The value of this
      #    entitlement must be an array that includes the string \"CloudKit\" or
      #    \"CloudKit-Anonymous\"."
      # 也就是说「先问有没有权限」这个动作本身就会炸，探测不了。
      #
      # 现在改为**彻底删除对应功能代码**，工程里不再有任何 CloudKit /
      # BGTaskScheduler / APNs 注册的调用：
      #   - iCloud 同步      ICloudSyncService.swift 已删除（417 行），
      #                      AppState_iOS 的同步逻辑、设置页「iCloud 同步」区块、
      #                      AppSettings.iCloudSyncEnabled 一并移除。
      #   - 后台任务        BackgroundTaskService.swift 已删除（173 行）。
      #   - 远程推送注册    PushNotificationService 只保留**本地通知**
      #                      （UNUserNotificationCenter，不需要 entitlement，
      #                       待办/习惯/纪念日/复习/番茄钟提醒功能完整）。
      #
      # 保留的能力（均不需要任何 entitlement）：
      #   本地通知 · Spotlight 索引 · 自定义 URL scheme 深度链接 ·
      #   相机/相册 · 麦克风+语音识别 · Face ID · 日历/提醒事项 · 本地网络
      #
      # 升级到付费 Apple Developer Program 后，若要恢复这些功能，需要同时：
      #   1. 解开下面相应的 entitlement 注释；
      #   2. 重新实现对应服务（已删除，git 历史里有原始版本）；
      #   3. 重新 `xcodegen generate` 并在 Xcode 里选好团队。
      #
      # 个人账号下若声明下列任一能力，Xcode 会直接拒绝创建描述文件：
      #   com.apple.developer.family-controls      (Family Controls)
      #   com.apple.developer.associated-domains   (Associated Domains)
      #   com.apple.developer.icloud-*             (iCloud)
      #   com.apple.developer.ubiquity-*
      # → "Personal development teams … do not support the Family Controls
      #    (Development), Associated Domains, and iCloud capabilities."
      #
      # 即使能力本身个人账号支持，只要当前描述文件里没有，Xcode 也会报
      # "Entitlements … not found and could not be included in profile."
      #   com.apple.developer.push-notifications
      #   com.apple.developer.background-modes
      #
      # 结论：个人账号下把 entitlements 清空是唯一稳妥做法。
      properties:
        # iCloud（付费账号 + 重新实现服务后才可启用）
        # com.apple.developer.ubiquity-container-identifiers:
        #   - "$(TeamIdentifierPrefix)com.skyc8266.smartnote.ios"
        # com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.skyc8266.smartnote.ios"
        # com.apple.developer.icloud-container-identifiers:
        #   - "iCloud.com.skyc8266.smartnote.ios"
        # com.apple.developer.icloud-services:
        #   - CloudKit
        #   - CloudDocuments
        #   - CloudKeyValueStore
        #
        # Universal Links（付费账号后启用）
        # com.apple.developer.associated-domains:
        #   - "applinks:smartnote.app"
        #   - "applinks:www.smartnote.app"
        #
        {}

  # ==================== iOS Widget Extension（暂时停用） ====================
  #
  # 停用原因：小组件需要 **App Groups** 才能读到主 App 的数据
  # （com.apple.security.application-groups + 一个 group 标识），
  # 而当前签名没有该能力——Widget 代码里的数据源本来就是占位注释，
  # 就算装上去也只会显示空内容。
  #
  # 与个人（免费）开发者账号无关：App Groups 本身是支持的，
  # 但需要主 App 与扩展**同时**声明同一个 group 并分别配置描述文件。
  # 在拿到该能力之前，先把小组件整体停用，避免装一个必然空白的扩展。
  #
  # 恢复方式（三处都要改，缺一个都不会生效）：
  #   1. 取消下面整个 target 的注释；
  #   2. 在 SmartNote-iOS 的 dependencies 里加回：
  #        - target: SmartNoteWidget
  #          embed: true
  #   3. 在 schemes.SmartNote-iOS.build.targets 里加回：SmartNoteWidget: all
  #
  # 源码保留在 Platforms/iOS/Views/Widget/（未被任何 target 引用，不会编译）。
  #   SmartNoteWidget:
  #     type: app-extension
  #     platform: iOS
  #     productName: SmartNoteWidget
  #     bundleId: com.skyc8266.smartnote.ios.widget
  #     sources:
  #       - path: Platforms/iOS/Views/Widget
  #         excludes:
  #           - "**/Info.plist"
  #     settings:
  #       base:
  #         PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.smartnote.ios.widget
  #         INFOPLIST_FILE: Platforms/iOS/Views/Widget/Info.plist
  #         CODE_SIGN_ENTITLEMENTS: Platforms/iOS/Views/Widget/SmartNoteWidget.entitlements
  #         MARKETING_VERSION: "$(MARKETING_VERSION)"
  #         CURRENT_PROJECT_VERSION: "$(CURRENT_PROJECT_VERSION)"
  #         APPLICATION_EXTENSION_API_ONLY: YES
  #         # 与主 App 一致：交给 Xcode 管理签名，扩展必须与主 App 同团队一起签名，
  #         # 否则装机时扩展无法被嵌入。
  #         CODE_SIGN_STYLE: Automatic
  #
  #     entitlements:
  #       path: Platforms/iOS/Views/Widget/SmartNoteWidget.entitlements
  #       # Widget 目前不声明任何能力：
  #       #   - `com.apple.security.app-sandbox` 是 **macOS 专有**键，在 iOS 扩展上无效；
  #       #     留着会触发「not found and could not be included in profile」。
  #       #   - iCloud 能力个人账号不支持，且 Widget 代码并不访问 CloudKit。
  #       # 若将来要用 App Group 与主 App 共享数据，在这里加
  #       # `com.apple.security.application-groups`（个人账号支持）。
  #       properties: {}
  #
  # ==================== iOS Live Activity Extension（暂时停用） ====================
  #
  # 停用原因：构建时的 `AppIntentsSSUTraining` 步骤失败——
  #   appintentsnltrainingprocessor: error: Unable to parse Info.plist
  #   Command AppIntentsSSUTraining failed with a nonzero exit code
  #
  # 根因是本 target 的 Info.plist 被改得只剩 NSExtension 字典，
  # 缺了 CFBundleIdentifier / CFBundleExecutable / CFBundleName 等
  # App Intents 元数据处理器必需的键，因此解析失败。
  # （该文件已用 `git checkout --` 从提交 6a46025 恢复，内容完好。）
  #
  # 但即使只补齐 Info.plist，本工程这里还有一处隐患，必须一并处理——
  # target 上同时写了 `INFOPLIST_FILE`（指向真实文件）和 `info:`
  # （xcodegen 生成到同一个路径）。两者并存就是「Multiple commands
  # produce .../Info.plist」的来源，恢复时**只能保留 INFOPLIST_FILE**，
  # 把整个 `info:` 块删掉。
  #
  # 恢复方式（四处都要改，缺一处都不会生效）：
  #   1. 取消下面整个 target 的注释，并删掉其中的 `info:` 块；
  #   2. 在 SmartNote-iOS 的 dependencies 里加回：
  #        - target: SmartNoteLiveActivity
  #          embed: true
  #   3. 在 schemes.SmartNote-iOS.build.targets 里加回：SmartNoteLiveActivity: all
  #   4. 去掉主 App sources 里的 `Views/LiveActivity/**` 排除。
  #
  # 源码保留在 Platforms/iOS/Views/LiveActivity/（未被任何 target 引用，不编译）。
  #
  #   SmartNoteLiveActivity:
  #     type: app-extension
  #     platform: iOS
  #     productName: SmartNoteLiveActivity
  #     bundleId: com.skyc8266.smartnote.ios.liveactivity
  #     sources:
  #       - path: Platforms/iOS/Views/LiveActivity
  #         excludes:
  #           - "**/Info.plist"
  #     settings:
