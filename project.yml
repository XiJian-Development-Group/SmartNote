schemes:
  SmartNote:
    build:
      targets:
        SmartNote: all
    run:
      config: Debug
    archive:
      config: Release

  SmartNote-iOS:
    build:
      targets:
        SmartNote-iOS: all
        # 两个扩展暂时停用，恢复时把对应行加回来（三处缺一不可：
        # target 定义 / 这里的 scheme / dependencies 的 embed）：
        #   SmartNoteWidget: all        # 需 App Groups 权限
        #   SmartNoteLiveActivity: all
    run:
      config: Debug
      # 不在这里写死 destination（例如 `platform=iOS Simulator,name=iPhone 16 Pro`）：
      # xcodegen 不会把它写进 scheme，留着只会造成「已经指定了模拟器却仍然选不到」
      # 的误解。不指定时由 Xcode 按已安装的运行时动态填充运行目标列表。
    archive:
      config: Release